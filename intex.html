<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 1024px;
            margin: auto;
        }
        .gradient-bg {
            background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%);
        }
        .star-filled {
            color: #fbbf24;
        }
        .star-empty {
            color: #d1d5db;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        
        /* New "Fixit" Text Animation */
        @keyframes filter-scan {
            0% {
                transform: translateY(-5px);
                text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 -20px 10px rgba(59, 130, 246, 0.2);
            }
            50% {
                transform: translateY(0);
                text-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 5px rgba(59, 130, 246, 0.1);
            }
            100% {
                transform: translateY(5px);
                text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 20px 10px rgba(59, 130, 246, 0.2);
            }
        }

        .text-animate-filter {
            animation: filter-scan 1.5s ease-in-out infinite alternate;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div id="app" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden relative">

    <!-- Header Section -->
    <header class="p-6 gradient-bg text-white flex justify-between items-center relative">
        <h1 id="logo" class="text-3xl font-bold cursor-pointer transition-transform duration-500 transform hover:scale-110">Fixit</h1>
        <nav class="flex space-x-4">
            <button id="register-worker-btn" class="text-white hover:text-gray-200 transition-colors duration-200">Register as a Worker</button>
            <button id="admin-login-btn" class="text-white hover:text-gray-200 transition-colors duration-200">Admin</button>
        </nav>
    </header>

    <!-- Pages Container -->
    <main class="p-6">

        <!-- Home Page -->
        <div id="home-page" class="page active text-center py-10">
            <div class="mb-8">
                <h2 class="text-6xl md:text-8xl font-black text-blue-600 text-animate-filter">Fixit</h2>
            </div>
            <p class="text-gray-600 text-lg mb-8">Connecting you with trusted professionals instantly.</p>
            <form id="search-form" class="flex flex-col md:flex-row gap-4 p-4 bg-white rounded-xl shadow-md relative">
                <!-- Worker Type Input with Auto-suggestion -->
                <div class="relative flex-1">
                    <input type="text" id="worker-type-input" placeholder="e.g., Plumber, Electrician" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
                    <div id="worker-type-suggestions" class="absolute z-10 w-full mt-1 bg-white rounded-lg shadow-lg border border-gray-200 hidden"></div>
                </div>
                <!-- Location Input with Auto-suggestion -->
                <div class="relative flex-1">
                    <input type="text" id="location-input" placeholder="Your Location" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
                    <div id="location-suggestions" class="absolute z-10 w-full mt-1 bg-white rounded-lg shadow-lg border border-gray-200 hidden"></div>
                </div>
                <button type="submit" class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-colors duration-200">Find Worker</button>
            </form>
        </div>

        <!-- Search Results Page -->
        <div id="results-page" class="page py-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Workers in <span id="location-display" class="text-blue-600"></span></h2>
            <div id="worker-list" class="space-y-4">
                <!-- Worker profiles will be injected here by JavaScript -->
            </div>
            <button onclick="showPage('home-page')" class="mt-8 bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200">Back to Home</button>
        </div>

        <!-- Worker Profile Page -->
        <div id="profile-page" class="page py-10">
            <div id="worker-profile-content" class="bg-white rounded-xl shadow-lg p-6">
                <!-- Worker profile details will be injected here -->
            </div>
            <button onclick="showPage('results-page')" class="mt-8 bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200">Back to Results</button>
        </div>

    </main>

    <!-- Modals -->

    <!-- Generic Modal for Booking, Registration, etc. -->
    <div id="modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-sm relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors duration-200">&times;</button>
            <h3 id="modal-title" class="text-2xl font-bold mb-4"></h3>
            <div id="modal-content" class="text-gray-700 mb-6"></div>
            <button onclick="closeModal()" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg w-full hover:bg-blue-700 transition-colors duration-200">Close</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-sm relative">
            <button onclick="closeAdminModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors duration-200">&times;</button>
            <h3 class="text-2xl font-bold mb-4">Admin Login</h3>
            <p class="text-gray-600 mb-4">Enter the admin password to continue.</p>
            <input type="password" id="admin-password-input" placeholder="Password" class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkAdminPassword()" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg w-full hover:bg-blue-700 transition-colors duration-200">Log In</button>
            <p id="admin-error" class="text-red-500 text-sm mt-2"></p>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-panel" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-md relative overflow-y-auto max-h-[80vh]">
            <button onclick="closeAdminPanel()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors duration-200">&times;</button>
            <h3 class="text-2xl font-bold mb-4">Admin Dashboard</h3>
            <!-- Admin content will be injected here -->
        </div>
    </div>

</div>

<script>
    // --- Data Simulation ---
    // In a real app, this data would come from a database.
    const workers = [
        { id: 1, name: "Ali Ahmed", rating: 4.5, rate: 800, profession: "Plumber", location: "Kochi", experience: "5+ years", works: "Fixed over 200 leaks, installed new pipelines, and serviced complex drainage systems. Specializes in residential and commercial plumbing.", whatsapp: "919876543210", photo: "https://placehold.co/128x128/3b82f6/ffffff?text=Ali+A" },
        { id: 2, name: "Maria Khan", rating: 5.0, rate: 1200, profession: "Electrician", location: "Kochi", experience: "10+ years", works: "Highly skilled in residential wiring, fuse box repairs, and new appliance installations. Certified and insured for all electrical work.", whatsapp: "919988776655", photo: "https://placehold.co/128x128/10b981/ffffff?text=Maria+K" },
        { id: 3, name: "John Varghese", rating: 4.8, rate: 1000, profession: "AC Mechanic", location: "Kochi", experience: "7 years", works: "Expert in AC repair, installation, and maintenance for all major brands. Provides efficient and timely service with a focus on customer satisfaction.", whatsapp: "919012345678", photo: "https://placehold.co/128x128/ef4444/ffffff?text=John+V" },
        { id: 4, name: "Rahul Sharma", rating: 4.2, rate: 750, profession: "Plumber", location: "Kozhikode", experience: "3 years", works: "Reliable plumber for all household needs, from minor drips to full-scale pipe replacement.", whatsapp: "919123456789", photo: "https://placehold.co/128x128/f97316/ffffff?text=Rahul+S" },
        { id: 5, name: "Priya Menon", rating: 4.9, rate: 950, profession: "Electrician", location: "Kozhikode", experience: "8 years", works: "Specializes in smart home wiring and security system installations. Known for her attention to detail.", whatsapp: "919567890123", photo: "https://placehold.co/128x128/8b5cf6/ffffff?text=Priya+M" }
    ];

    const suggestedLocations = ["Kochi", "Kozhikode", "Thiruvananthapuram", "Thrissur", "Malappuram", "Palakkad", "Kottayam", "Alappuzha", "Kannur", "Kollam", "Pathanamthitta", "Idukki", "Wayanad"];
    const suggestedProfessions = ["Plumber", "Electrician", "AC Mechanic", "Carpenter", "Painter", "Gardener", "Welder", "Mason"];

    // --- Page Management ---
    const pages = document.querySelectorAll('.page');
    function showPage(pageId) {
        pages.forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // --- Star Rating Generator ---
    function getStarRating(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= rating) {
                stars += '<span class="star-filled">&#9733;</span>';
            } else if (i - rating <= 0.5) {
                stars += '<span class="star-filled">&#9733;</span>'; // A simple way to handle half stars visually
            } else {
                stars += '<span class="star-empty">&#9733;</span>';
            }
        }
        return stars;
    }

    // --- Home Page Search Logic ---
    document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const workerType = document.getElementById('worker-type-input').value.toLowerCase();
        const location = document.getElementById('location-input').value.toLowerCase();
        
        const filteredWorkers = workers.filter(worker => 
            worker.profession.toLowerCase().includes(workerType) && worker.location.toLowerCase().includes(location)
        );

        const workerList = document.getElementById('worker-list');
        workerList.innerHTML = ''; // Clear previous results

        if (filteredWorkers.length === 0) {
            workerList.innerHTML = '<p class="text-center text-gray-500">No workers found for this search.</p>';
        } else {
            filteredWorkers.forEach(worker => {
                const workerCard = document.createElement('div');
                workerCard.className = 'bg-gray-50 p-6 rounded-xl shadow-md cursor-pointer hover:bg-gray-100 transition-colors duration-200 flex items-center space-x-4';
                workerCard.innerHTML = `
                    <div class="flex-shrink-0">
                        <img src="${worker.photo}" alt="${worker.name}" class="w-16 h-16 rounded-full border-2 border-blue-400">
                    </div>
                    <div class="flex-grow">
                        <h4 class="text-xl font-bold text-gray-800">${worker.name} <span class="text-base text-gray-500 font-normal">(${worker.profession})</span></h4>
                        <p class="text-gray-600 mt-1">Rate: ₹${worker.rate}/hr</p>
                        <div class="flex items-center mt-1">
                            <span class="text-lg">${getStarRating(worker.rating)}</span>
                            <span class="text-sm text-gray-500 ml-2">(${worker.rating})</span>
                        </div>
                    </div>
                `;
                workerCard.addEventListener('click', () => showWorkerProfile(worker));
                workerList.appendChild(workerCard);
            });
        }

        document.getElementById('location-display').textContent = location;
        showPage('results-page');
    });

    // --- Worker Profile Page Logic ---
    function showWorkerProfile(worker) {
        const profileContent = document.getElementById('worker-profile-content');
        profileContent.innerHTML = `
            <div class="text-center">
                <img src="${worker.photo}" alt="${worker.name}" class="w-32 h-32 rounded-full mx-auto border-4 border-blue-400 mb-4">
                <h3 class="text-3xl font-bold text-gray-800">${worker.name}</h3>
                <p class="text-xl text-gray-500">${worker.profession}</p>
                <div class="flex items-center justify-center mt-2">
                    <span class="text-2xl">${getStarRating(worker.rating)}</span>
                    <span class="text-lg text-gray-500 ml-2">(${worker.rating})</span>
                </div>
            </div>
            <div class="mt-8 text-gray-700">
                <h4 class="text-2xl font-semibold mb-2">About Me</h4>
                <p class="mb-4">${worker.works}</p>
                <ul class="space-y-2 text-lg">
                    <li><span class="font-semibold">Experience:</span> ${worker.experience}</li>
                    <li><span class="font-semibold">Location:</span> ${worker.location}</li>
                    <li><span class="font-semibold">Rate:</span> ₹${worker.rate}/hr</li>
                    <li class="flex items-center space-x-2"><span class="font-semibold">WhatsApp:</span> ${worker.whatsapp} <a href="https://wa.me/${worker.whatsapp}" target="_blank" class="text-green-500 hover:text-green-600">&#x2713;</a></li>
                </ul>
            </div>
            <button onclick="openBookingModal('${worker.name}', '${worker.profession}', '${worker.whatsapp}')" class="mt-8 bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg w-full shadow-lg hover:bg-blue-700 transition-colors duration-200">
                Book a Service
            </button>
        `;
        showPage('profile-page');
    }

    // --- Modals Logic ---
    function openModal(title, content) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-content').innerHTML = content;
        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
    }

    function openBookingModal(workerName, profession, whatsappNumber) {
        const orderId = 'FIX' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 1000);
        const bookingMessage = `Hi, I would like to book a ${profession} service from you. This is a request from Fixit. My Order ID is ${orderId}. Please confirm your availability.`;
        const content = `
            <p>You are about to book a service with ${workerName}. Your unique Order ID is <span class="font-bold text-blue-600">${orderId}</span>.</p>
            <p class="mt-4">This will open WhatsApp with the following message for the worker:</p>
            <textarea class="w-full mt-2 p-3 border rounded-lg resize-none bg-gray-50" rows="4" readonly>${bookingMessage}</textarea>
            <a href="https://wa.me/${whatsappNumber}?text=${encodeURIComponent(bookingMessage)}" target="_blank" class="block mt-4 bg-green-500 text-white text-center font-semibold py-3 px-6 rounded-lg w-full shadow-lg hover:bg-green-600 transition-colors duration-200">
                Open WhatsApp
            </a>
        `;
        openModal("Book Service", content);
    }

    function openRegistrationModal() {
        const content = `
            <p>This is a registration form for new workers. In a real application, this form would collect your details and a registration fee.</p>
            <p class="text-sm mt-2 text-gray-500">For demonstration purposes, this will not submit any data.</p>
            <!-- Here you would add a real form -->
            <form class="mt-4 space-y-4">
                <input type="text" placeholder="Your Name" class="w-full p-3 border border-gray-300 rounded-lg">
                <input type="text" placeholder="Profession" class="w-full p-3 border border-gray-300 rounded-lg">
                <input type="email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg">
                <button type="button" class="bg-yellow-500 text-white font-semibold py-3 px-6 rounded-lg w-full shadow-lg hover:bg-yellow-600 transition-colors duration-200">
                    Pay & Register
                </button>
            </form>
        `;
        openModal("Register as a Worker", content);
    }

    document.getElementById('register-worker-btn').addEventListener('click', openRegistrationModal);
    document.getElementById('admin-login-btn').addEventListener('click', () => {
        document.getElementById('admin-modal').classList.remove('hidden');
    });

    function closeAdminModal() {
        document.getElementById('admin-modal').classList.add('hidden');
        document.getElementById('admin-error').textContent = '';
    }

    // --- Admin Panel Logic (Simulated) ---
    function checkAdminPassword() {
        const password = document.getElementById('admin-password-input').value;
        const correctPassword = "shahzad@2005"; // WARNING: Hard-coded password for demonstration. Not secure.
        const errorElement = document.getElementById('admin-error');

        if (password === correctPassword) {
            closeAdminModal();
            openAdminPanel();
        } else {
            errorElement.textContent = "Incorrect password. Please try again.";
        }
    }

    function openAdminPanel() {
        const adminPanel = document.getElementById('admin-panel');
        let content = `
            <h4 class="text-xl font-bold mb-4">Worker Registration Requests</h4>
            <div class="border-t pt-4">
                <p class="text-gray-500">No new registration requests at this time.</p>
            </div>
            <h4 class="text-xl font-bold mt-8 mb-4">All Bookings History</h4>
            <div class="space-y-4">
                <div class="p-4 bg-gray-100 rounded-lg">
                    <p class="font-semibold">Order ID: FIX234567</p>
                    <p>Booked by: User-XYZ</p>
                    <p>Worker: Ali Ahmed (Plumber)</p>
                    <p>Date: Nov 20, 2025</p>
                </div>
                <div class="p-4 bg-gray-100 rounded-lg">
                    <p class="font-semibold">Order ID: FIX890123</p>
                    <p>Booked by: User-ABC</p>
                    <p>Worker: Maria Khan (Electrician)</p>
                    <p>Date: Nov 19, 2025</p>
                </div>
            </div>
        `;
        document.getElementById('admin-panel').querySelector('.bg-white').innerHTML = `<button onclick="closeAdminPanel()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors duration-200">&times;</button>` + content;
        adminPanel.classList.remove('hidden');
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').classList.add('hidden');
    }

    // --- Autocomplete for Location Input ---
    const locationInput = document.getElementById('location-input');
    const locationSuggestionsContainer = document.getElementById('location-suggestions');
    
    locationInput.addEventListener('input', () => {
        const query = locationInput.value.toLowerCase();
        locationSuggestionsContainer.innerHTML = '';
        if (query.length === 0) {
            locationSuggestionsContainer.classList.add('hidden');
            return;
        }

        const filteredSuggestions = suggestedLocations.filter(location =>
            location.toLowerCase().startsWith(query)
        );

        if (filteredSuggestions.length > 0) {
            filteredSuggestions.forEach(location => {
                const suggestionItem = document.createElement('div');
                suggestionItem.textContent = location;
                suggestionItem.className = 'p-3 cursor-pointer hover:bg-gray-100 transition-colors duration-200 rounded-md';
                suggestionItem.addEventListener('click', () => {
                    locationInput.value = location;
                    locationSuggestionsContainer.classList.add('hidden');
                });
                locationSuggestionsContainer.appendChild(suggestionItem);
            });
            locationSuggestionsContainer.classList.remove('hidden');
        } else {
            locationSuggestionsContainer.classList.add('hidden');
        }
    });

    // --- Autocomplete for Worker Type Input ---
    const workerTypeInput = document.getElementById('worker-type-input');
    const workerTypeSuggestionsContainer = document.getElementById('worker-type-suggestions');
    
    workerTypeInput.addEventListener('input', () => {
        const query = workerTypeInput.value.toLowerCase();
        workerTypeSuggestionsContainer.innerHTML = '';
        if (query.length === 0) {
            workerTypeSuggestionsContainer.classList.add('hidden');
            return;
        }

        const filteredSuggestions = suggestedProfessions.filter(profession =>
            profession.toLowerCase().startsWith(query)
        );

        if (filteredSuggestions.length > 0) {
            filteredSuggestions.forEach(profession => {
                const suggestionItem = document.createElement('div');
                suggestionItem.textContent = profession;
                suggestionItem.className = 'p-3 cursor-pointer hover:bg-gray-100 transition-colors duration-200 rounded-md';
                suggestionItem.addEventListener('click', () => {
                    workerTypeInput.value = profession;
                    workerTypeSuggestionsContainer.classList.add('hidden');
                });
                workerTypeSuggestionsContainer.appendChild(suggestionItem);
            });
            workerTypeSuggestionsContainer.classList.remove('hidden');
        } else {
            workerTypeSuggestionsContainer.classList.add('hidden');
        }
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', (e) => {
        if (!locationInput.contains(e.target) && !locationSuggestionsContainer.contains(e.target)) {
            locationSuggestionsContainer.classList.add('hidden');
        }
        if (!workerTypeInput.contains(e.target) && !workerTypeSuggestionsContainer.contains(e.target)) {
            workerTypeSuggestionsContainer.classList.add('hidden');
        }
    });

</script>

</body>
</html>
