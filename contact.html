<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FixIt Web - Contact</title>
    <meta name="description" content="Contact FixIt Web for a free website quote.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">FixIt<span>Web</span></a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="Primary">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="features">
        <div class="container">
          <h1>Contact Us</h1>
          <p class="lead">Tell us about your project and we'll get back within 1 business day.</p>
          <form id="contact-form" class="feature" style="max-width:640px;">
            <label>
              Name
              <input type="text" name="name" required placeholder="Your name" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--border);border-radius:10px;">
            </label>
            <div style="height:12px"></div>
            <label>
              Email
              <input type="email" name="email" required placeholder="you@example.com" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--border);border-radius:10px;">
            </label>
            <div style="height:12px"></div>
            <label>
              Message
              <textarea name="message" required rows="5" placeholder="What do you need?" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--border);border-radius:10px;"></textarea>
            </label>
            <div style="height:16px"></div>
            <button class="btn btn-primary" type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span id="year"></span> FixIt Web. All rights reserved.</p>
        <ul class="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
  </html>
